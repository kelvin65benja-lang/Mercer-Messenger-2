name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Android project
        run: |
          echo "Checking repository..."
          pwd
          ls -la

          if [ ! -d "./android" ]; then
            echo "ERROR: android folder was not found."
            echo "Repository structure:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Android folder found:"
          find ./android -maxdepth 2 -type f | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          echo "Starting Android APK build..."

          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            ./android/gradlew \
              -p ./android \
              assembleDebug \
              --stacktrace \
              --no-daemon
          else
            gradle \
              -p ./android \
              assembleDebug \
              --stacktrace \
              --no-daemon
          fi

      - name: Find APK
        run: |
          echo "Searching for generated APK..."
          find ./android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mercer-Messenger-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
