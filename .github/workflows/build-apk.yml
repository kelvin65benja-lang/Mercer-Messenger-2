name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check Android project
        run: |
          echo "Checking repository..."
          pwd
          echo "Files and folders:"
          ls -la

          if [ -d "./android" ]; then
            echo "Android folder found."
            ls -la ./android
          else
            echo "ERROR: android folder was not found."
            exit 1
          fi

      - name: Build APK
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            ./android/gradlew -p ./android assembleDebug --stacktrace --no-daemon
          else
            echo "gradlew not found. Using installed Gradle..."
            gradle -p ./android assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find ./android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mercer-Messenger-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
